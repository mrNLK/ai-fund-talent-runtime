# Founders' Wall sync - manual only.
#
# This workflow was previously scheduled hourly, but this Talent runtime repo does
# not have the Razorpay secrets it requires. Keeping it manual avoids recurring
# failed GitHub Actions emails while preserving the workflow in case someone needs
# to run the wall sync intentionally later.
name: wall-sync

on:
  workflow_dispatch: {}

concurrency:
  group: wall-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync wall from Razorpay
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wall-sync.mjs
